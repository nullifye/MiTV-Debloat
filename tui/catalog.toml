# Notes for the Debloat menu. The menu lists what's actually installed on the TV; packages here
# get a label, a note and advice. Packages not listed just show their name.
#
# advice:
#   safe      fine to disable for most people (shown with "a" = mark all safe)
#   caution   works, but you lose something (read the note)
#   keep      better left on; you can still disable it
#   never     the TV needs it: the menu won't disable it
#   handover  Google TV Home: done by Install → Google TV handover, not here
#
# restrict = true: kept, but better stopped from running in the background (it still works when
# opened). "Set up my TV", Speed and privacy, and scripts/restrict.sh --recommended do that.
#
# Everything is only *disabled* (pm disable-user --user 0), never uninstalled; Restore turns it
# back on.

