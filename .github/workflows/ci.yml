name: CI

on:
  push:
    branches: [master, main]
    # A version tag (v1.9) also publishes the signed APK as a GitHub Release.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release signing key (repository secrets, see docs/development.md). Absent on forks and pull
      # requests from them: those builds fall back to the runner's throwaway debug key.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Refuse a wrapper jar that doesn't match the checksums Gradle publishes.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action's default package list still names the legacy "tools" package, which the SDK
      # repository no longer publishes: sdkmanager fails with "Failed to find package 'tools'".
      # Ask for what the build actually needs (compileSdk 36 and AGP 8.13's build tools).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Caches ~/.gradle (dependencies, wrapper distribution, build cache) between runs.
      - uses: gradle/actions/setup-gradle@v4

      # The keystore lives only in the runner's temp folder, for this job.
      - name: Release signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, unit tests and release build
        working-directory: launcher
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleRelease

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # The terminal app (tui/): checked and built for every desktop platform. Intel Macs are
  # cross-compiled on Apple Silicon (GitHub no longer has Intel Mac runners), so their tests run
  # only as the arm64 build.
  tui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: tvhome-tui, test: true }
          - { os: macos-14, target: aarch64-apple-darwin, exe: tvhome-tui, test: true }
          - { os: macos-14, target: x86_64-apple-darwin, exe: tvhome-tui, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: tvhome-tui.exe, test: true }
          # Android phones, in Termux: 64-bit, and 32-bit for older phones. Built with the
          # runner's Android NDK; API 24 (Android 7.0) is Termux's minimum.
          - { os: ubuntu-latest, target: aarch64-linux-android, ndk: aarch64-linux-android24, exe: tvhome-tui, test: false }
          - { os: ubuntu-latest, target: armv7-linux-androideabi, ndk: armv7a-linux-androideabi24, exe: tvhome-tui, test: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
          key: ${{ matrix.target }}

      - name: Android NDK compiler
        if: matrix.ndk
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          T="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          t="$(echo '${{ matrix.target }}' | tr '-' '_')"
          {
            echo "CC_$t=$BIN/${{ matrix.ndk }}-clang"
            echo "AR_$t=$BIN/llvm-ar"
            echo "CARGO_TARGET_${T}_LINKER=$BIN/${{ matrix.ndk }}-clang"
          } >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Tests
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Release build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Cargo's strip=true is a fallback; explicitly strip the uploaded binary on each host.
      # Android binaries need the NDK's ELF-aware tool, not the Linux host's strip.
      - name: Strip Linux / Android release binary
        if: runner.os == 'Linux'
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          if [ -n '${{ matrix.ndk }}' ]; then
            "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$binary"
          else
            strip --strip-unneeded "$binary"
          fi

      # On macOS, the system stripper also works when rust-objcopy cannot load libLLVM.dylib.
      - name: Strip macOS release binary
        if: runner.os == 'macOS'
        run: strip -S -x target/${{ matrix.target }}/release/${{ matrix.exe }}

      - name: Strip Windows release executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $strip = Join-Path $sysroot 'lib/rustlib/${{ matrix.target }}/bin/llvm-strip.exe'
          & $strip --strip-unneeded 'target/${{ matrix.target }}/release/${{ matrix.exe }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-tui-${{ matrix.target }}
          path: tui/target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  # Tag v<versionName> → a GitHub Release with tvhome-<version>.apk and the terminal app for each
  # platform, downloadable without signing in.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Never publish a debug-signed APK: users couldn't update it later without losing settings.
      - name: Check the release key is set
        if: env.SIGNING_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Repository secret SIGNING_KEYSTORE_BASE64 is missing (see docs/development.md)."
          exit 1

      # The tag must match the app's versionName, so the release and the app agree.
      - name: Check the tag matches the version
        id: version
        run: |
          VERSION="$(sed -n "s/^ *versionName '\(.*\)'.*/\1/p" launcher/app/build.gradle)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName '$VERSION' in launcher/app/build.gradle."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: app-release

      - uses: actions/download-artifact@v4
        with:
          pattern: tvhome-tui-*
          path: tui-bin

      # One archive per platform: .zip for Windows, .tar.gz (executable bit restored) elsewhere.
      - name: Package the terminal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for dir in tui-bin/tvhome-tui-*; do
            target="${dir#tui-bin/tvhome-tui-}"
            name="tvhome-tui-$VERSION-$target"
            if [ -f "$dir/tvhome-tui.exe" ]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" tvhome-tui.exe)
            else
              chmod +x "$dir/tvhome-tui"
              tar -czf "dist/$name.tar.gz" -C "$dir" tvhome-tui
            fi
          done
          ls -l dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mv app-release.apk "tvhome-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "tvhome-$VERSION.apk" dist/* \
            --title "TV Home $VERSION" --generate-notes
